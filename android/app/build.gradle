plugins {
    id 'com.android.application'
}

android {
    namespace 'com.petarena.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.petarena.game'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        // A fixed, public debug key (password "android") so every build can install over the
        // previous one and keep its progress. Use your own private key for Google Play.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/** Copies the game HTML and its fonts (shared with the iOS app) into the APK assets. */
abstract class BundleGame extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getGameFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void bundle() {
        fs.sync { spec ->
            spec.from(gameFiles)
            spec.into(outputDir)
        }
    }
}

def bundleGame = tasks.register('bundleGame', BundleGame) {
    def repo = rootProject.projectDir.parentFile
    gameFiles.from(new File(repo, 'Pet Arena (1).html'))
    gameFiles.from(fileTree(new File(repo, 'ios/PetArena/Web')) { include '*.ttf' })
    outputDir = layout.buildDirectory.dir('generated/gameAssets')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(bundleGame) { it.outputDir }
    }
}

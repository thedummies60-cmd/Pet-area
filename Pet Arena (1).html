<title>Pet Arena · Halloween</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Creepster&display=swap" rel="stylesheet">
<style>
:root{--bg:#150a22;--panel:#2a1245;--ink:#fff;--gold:#ff9a1f;--elix:#c04dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150a22;--panel:#2a1245}}
:root[data-theme="dark"]{--bg:#150a22;--panel:#2a1245}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Lilita One','Arial Black',system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
@supports(height:100dvh){html,body{height:100dvh}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
b{font-weight:400}
.ico{height:1.15em;width:1.15em;vertical-align:-.25em}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:22px}
.hc{display:flex;align-items:center;gap:4px}
#tm{font-size:28px;color:var(--gold);text-shadow:0 2px 0 #000a}
#pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 4px;font-size:14px;min-height:24px}
.pp{display:flex;align-items:center;gap:6px;min-width:0}.pp .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.rb{font-style:normal;font-size:12px;padding:1px 8px;border-radius:10px;color:#1b1b2a;white-space:nowrap}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{border-radius:14px;box-shadow:0 0 0 3px #000a,0 8px 24px #0008}
#tray{padding:8px 8px 10px;background:var(--panel);border-radius:18px 18px 0 0}
#elix{height:24px;background:#0007;border-radius:12px;position:relative;overflow:hidden;margin-bottom:8px;border:2px solid #000a}
#elixf{height:100%;width:0;background:linear-gradient(90deg,#7a22d8,#e070ff);position:relative;overflow:hidden;transition:width .12s linear}
#elixf::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff7 50%,transparent 70%);animation:sh 1.6s linear infinite}
#elix.full{animation:pl .8s ease-in-out infinite}
#tm{cursor:pointer}#tm::after{content:'';display:inline-block;width:10px;height:14px;margin-left:8px;border-left:4px solid #fff9;border-right:4px solid #fff9;vertical-align:middle}
#tm.low{animation:pl2 1s ease-in-out infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes pl{50%{box-shadow:0 0 16px #e070ff}}
@keyframes pl2{50%{transform:scale(1.25)}}
@keyframes pop{from{transform:translateY(40px) scale(.5);opacity:0}}
@keyframes fin{from{opacity:0;transform:scale(1.06)}}
@keyframes fl{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-3deg) translateY(-6px) scale(1.04)}}
@keyframes bt{50%{transform:scale(1.06)}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.card.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1) backwards}
#ov{animation:fin .3s ease-out}
h1{animation:fl 3s ease-in-out infinite}
.btn:not(.b2):not(.cb){animation:bt 1.6s ease-in-out infinite}.btn:not(.b2):not(.cb):active{animation:none}
.chb{width:160px;margin:6px 0;animation:shk 1.4s ease-in-out infinite;cursor:pointer}.chb img{width:100%;filter:drop-shadow(0 8px 10px #000a)}
.chb.opened{animation:bnc .5s;filter:drop-shadow(0 0 22px #ffd23f)}
.btn.up{font-size:13px;padding:4px 8px;box-shadow:0 3px 0 #4a1a8a}

 const d=dstate(),done=d.ok?d.i:d.i+1;

 const nx_=TR.find(r=>S.tr<r[0]);

 document.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{const t=+b.dataset.t,r=TR.find(x=>x[0]==t);S.tc.push(t);S.co+=r[1];save();sfx(880,.3,'triangle',.07);road('+'+r[1]+' munten!')})}
function coll(note){
 state='menu';const ids=Object.keys(C).sort((a,b)=>(!!C[b].lim-!!C[a].lim)||C[a].tr-C[b].tr);
 $('ov').innerHTML=`<div class="top"><button class="btn" id="bk">Terug</button><span>Deck ${S.dk.length}/8</span><span>${img('coin')} ${S.co}</span></div><p class="how">${note||'Tik op een held voor info, upgraden en uitrusten. Nieuwe helden koop je hier.'}</p><div class="grid">${ids.map(id=>{const c=C[id],o=S.own.includes(id),d=S.dk.includes(id);return `<div class="cc ${o?(d?'in':''):'lock'}${c.lim?' lim':''}" data-id="${id}">${img(id,'')}<b>${c.n}</b>${c.lim?"<span class='lt'>LIMITED</span>":''}<small>${c.sp?'Spreuk':'Lv '+lvl(id)+' · HP '+Math.round(c.hp*lm(id))+' · '+Math.round(c.d*lm(id)/c.cd)+' schade/s'}</small><small>Elixir ${c.c}</small>${o&&!c.sp?upb(id):''}<em>${o?(d?'In deck':'Tik voor info'):c.lim&&!lOn()?'Verlopen':S.tr<c.tr?c.tr+' trofeeën nodig':c.p+' munten'+(c.lim?' · nog '+lLeft():'')}</em></div>`}).join('')}</div>`;
 $('bk').onclick=menu;
 document.querySelectorAll('.up').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const id=b.dataset.u,n=need(id),k=ucost(id);if(S.co<k)return coll('Nog '+(k-S.co)+' munten nodig!');S.sh[id]-=n;S.co-=k;S.lv[id]=lvl(id)+1;save();sfx(880,.3,'triangle',.07);coll(C[id].n+' is nu niveau '+S.lv[id]+'!')});
 document.querySelectorAll('.cc').forEach(e=>e.onclick=()=>{
  const id=e.dataset.id,c=C[id];let n='';if(S.own.includes(id))return hero(id);
  if(S.own.includes(id)){
   if(S.dk.includes(id)){if(S.dk.length>4)S.dk=S.dk.filter(k=>k!=id);else n='Je deck heeft minimaal 4 helden nodig.'}
   else if(S.dk.length<8)S.dk.push(id);else n='Je deck zit vol (8). Haal eerst een held eruit.'}
  else if(c.lim&&!lOn())n='Deze limited held is verlopen.';
  else if(S.tr<c.tr)n='Nog '+(c.tr-S.tr)+' trofeeën nodig voor '+c.n+'.';

  else{S.co-=c.p;S.own.push(id);if(S.dk.length<8)S.dk.push(id);n=c.n+' is van jou!';sfx(880,.3,'triangle',.07)}
  save();coll(n)})}
function finish(){
 state='end';const a=crowns[0],b=crowns[1],r=kw!=null?(kw==0?'w':'l'):a>b?'w':a<b?'l':'d',old=S.tr;
 let d=0,co=Math.round((r=='w'?50+15*a:r=='l'?15+10*a:25+10*a)*arena()[5]);
 if(r=='w'){d=RM?0:10;S.st++;S.w++}else if(r=='l'){d=RM?0:-Math.min(5,S.tr);S.st=0;S.l++}const orp=S.rp;if(RM){S.rp=Math.max(0,S.rp+(r=='w'?25:r=='l'?-20:0));if(r=='w')co=Math.round(co*1.5)}
 S.tr+=d;S.co+=co;const nm=AR.findIndex(m=>m[0]>old&&m[0]<=S.tr);if(nm>0)S.mp=nm;let cg=-1;if(r=='w'||Math.random()<.25){const x=Math.random()+AR.indexOf(arena())*.08;cg=x<.6?0:x<.88?1:x<.98?2:3;if(S.ch.length<6)S.ch.push(cg);else cg=-2}const up=RM&&rkI(S.rp)>rkI(orp);if(up){S.co+=150;if(S.ch.length<6)S.ch.push(1)}save();
 const nw=Object.keys(C).filter(k=>!S.own.includes(k)&&C[k].tr>old&&C[k].tr<=S.tr).map(k=>C[k].n);
 if(nm>0)nw.push('map '+AR[nm][1]);const X={w:['VICTORIE!','#ffd23f'],l:['VERLOREN','#ff6b7a'],d:['GELIJKSPEL','#9fd0ff']}[r];
 snd(r=='w'?'win':r=='l'?'lose':'dr');
 $('ov').style.display='flex';
 $('ov').innerHTML=`<h1 style="color:${X[1]}">${X[0]}</h1><div class="rank">${img('crown')} ${a} - ${b} ${img('crown')}</div><div class="rank">${RM?(S.rp>=orp?'+':'')+(S.rp-orp)+' rankpunten · '+rkName(S.rp)+(up?' - OMHOOG! (+150 munten + kist)':''):(d>=0?'+':'')+d+' trofeeën ('+S.tr+')'}${S.st>1?' · reeks '+S.st:''}</div><div class="rank">${img('coin')} +${co} munten</div>${nw.length?`<div class="rank" style="color:var(--gold)">Nieuw vrijgespeeld: ${nw.join(', ')}!</div>`:''}${rr()?"<div class='rank' style='color:var(--gold)'>Trofeeënweg: beloning klaar!</div>":''}${cg>=0?`<div class='rank'>${img('chest'+cg,'cs')} ${CH[cg].n} verdiend!</div>`:cg==-2?`<div class='rank'>Je kisten zijn vol!</div>`:''}<button class='btn' id='go'>Nog een keer!</button>${S.ch.length?`<button class='btn b2' id='ko'>Kisten (${S.ch.length})</button>`:''}<button class='btn b2' id='co'>Menu</button>`;
 $('go').onclick=start;$('co').onclick=menu;if($('ko'))$('ko').onclick=()=>chests();if(r=='w')confetti()}

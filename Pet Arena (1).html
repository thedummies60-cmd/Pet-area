<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a1430">
<title>Pet Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1430;--panel:#12254d;--ink:#fff;--gold:#ffd23f;--elix:#c04dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1430;--panel:#12254d}}
:root[data-theme="dark"]{--bg:#0a1430;--panel:#12254d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Lilita One','Arial Black',system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
@supports(height:100dvh){html,body{height:100dvh}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
b{font-weight:400}
.ico{height:1.15em;width:1.15em;vertical-align:-.25em}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:22px}
.hc{display:flex;align-items:center;gap:4px}
#tm{font-size:28px;color:var(--gold);text-shadow:0 2px 0 #000a}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{border-radius:14px;box-shadow:0 0 0 3px #000a,0 8px 24px #0008}
#tray{padding:8px 8px 10px;background:var(--panel);border-radius:18px 18px 0 0}
#elix{height:24px;background:#0007;border-radius:12px;position:relative;overflow:hidden;margin-bottom:8px;border:2px solid #000a}
#elixf{height:100%;width:0;background:linear-gradient(90deg,#7a22d8,#e070ff)}
#elixn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:15px;text-shadow:0 1px 2px #000}
#row{display:flex;gap:6px;align-items:flex-end}
#next{width:44px;text-align:center;font-size:11px;opacity:.85}
.nxi{width:34px;display:block;margin:0 auto}
#hand{flex:1;display:flex;gap:6px}

.card .ci{width:64%;max-width:54px}
.card .n{font-size:11px}
.card .c{position:absolute;left:-5px;top:-7px;width:25px;height:25px;border-radius:50%;background:var(--elix);border:2px solid #fff;font-size:15px;display:grid;place-items:center}
.card.off{filter:grayscale(.8) brightness(.55)}
.card.sel{transform:translateY(-12px) scale(1.05);border-color:var(--gold);box-shadow:0 0 16px var(--gold)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:radial-gradient(circle at 50% 35%,#24489aee,#060d26f4);text-align:center;padding:16px;z-index:5;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#ov::before,#ov::after{content:"";flex:1 1 0}
h1{font-size:clamp(52px,17vw,88px);margin:0;line-height:.9;color:var(--gold);text-shadow:0 4px 0 #b36b00,0 10px 18px #000a;transform:rotate(-3deg);font-weight:400}
.pets{display:flex;gap:4px;justify-content:center}
.pets img{width:15vw;max-width:68px;animation:hop 1.2s ease-in-out infinite}
.pets img:nth-child(2n){animation-delay:.2s}.pets img:nth-child(3n){animation-delay:.4s}
@keyframes hop{50%{transform:translateY(-10px) rotate(8deg)}}
.rank{font-size:22px}
.how{font-size:15px;max-width:300px;opacity:.85;margin:0;line-height:1.3}
.btn{font:inherit;font-size:30px;padding:14px 38px;border:0;border-radius:18px;background:linear-gradient(#ffd23f,#ff9a1f);color:#3a1d00;box-shadow:0 7px 0 #a35a00,0 12px 20px #0007;cursor:pointer}
.btn.b2{font-size:22px;padding:10px 26px;background:linear-gradient(#6ab0ff,#2a79d8);color:#fff;box-shadow:0 6px 0 #17468a}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #a35a00}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:20px}
.top .btn{font-size:18px;padding:8px 18px;box-shadow:0 4px 0 #a35a00}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.cc{background:linear-gradient(#2c4c8c,#1a2f5e);border:3px solid #fff3;border-radius:12px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px}
.cc>img{width:52px}.cc b{font-size:15px}.cc em{font-style:normal;color:var(--gold)}
.cc.in{border-color:var(--gold);box-shadow:0 0 10px #ffd23f88}
.cc.lock img{filter:grayscale(1) brightness(.45)}.cc.lock{opacity:.85}
.mp{display:flex;align-items:center;gap:14px;font-size:22px;line-height:1.1}
.mp small{font-size:14px;opacity:.85}
.ar{font:inherit;font-size:26px;width:44px;height:44px;border-radius:50%;border:3px solid #fff4;background:#1a2f5e;color:#fff}
.chip{background:#0008;border-radius:20px;padding:4px 14px;font-size:20px}
.nav{display:flex;gap:8px;width:100%;max-width:340px}
.nb{position:relative;flex:1;font:inherit;font-size:14px;color:#fff;background:linear-gradient(#2c4c8c,#1a2f5e);border:3px solid #fff3;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nb img{width:36px}
.dot{position:absolute;top:-8px;right:-6px;background:#ff3b4e;border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px}
.rd{display:flex;flex-direction:column;gap:8px;width:100%}
.rw{flex-direction:row;gap:10px;padding:8px 12px;font-size:14px;text-align:left}
.rw .ri{width:36px}.rw span{flex:1}.rw b{font-size:22px}
.btn.cb{font-size:16px;padding:6px 16px;box-shadow:0 3px 0 #17468a}
@media (prefers-reduced-motion:reduce){.pets img{animation:none}}
</style></head>

const nb=(id,i,t,d)=>`<button class='nb' id='${id}'>${img(i,'')}${t}${d?"<span class='dot'>!</span>":''}</button>`;
function daily(note){
 const d=dstate(),done=d.ok?d.i:d.i+1;
 $('ov').innerHTML=`<div class='top'><button class='btn' id='bk'>Terug</button><span>${img('coin')} ${S.co}</span></div><h1 style='font-size:44px'>DAGELIJKS</h1><p class='how'>${note||(d.ok?'Pak je beloning van vandaag. Kom elke dag terug: de beloning wordt steeds groter!':'Vandaag al gepakt. Kom morgen terug!')}</p><div class='grid'>${DR.map((v,i)=>`<div class='cc ${d.ok&&i==d.i?'in':i<done?'':'lock'}' ${i==6?"style='grid-column:span 3'":''}>${img(i==6?'gift':'coin','')}<b>Dag ${i+1}</b><em>${v} munten</em><small>${i<done?'Gehaald':d.ok&&i==d.i?'Vandaag!':''}</small></div>`).join('')}</div>${d.ok?`<button class='btn' id='cl'>Pak ${DR[d.i]} munten!</button>`:''}`;
 $('bk').onclick=menu;
 if($('cl'))$('cl').onclick=()=>{const n=dn(),c=S.dd==n-1,v=DR[c?S.ds%7:0];S.ds=c?S.ds+1:1;S.co+=v;S.dd=n;save();sfx(880,.3,'triangle',.07);daily('+'+v+' munten gepakt!')}}
function road(note){
 const nx_=TR.find(r=>S.tr<r[0]);
 $('ov').innerHTML=`<div class='top'><button class='btn' id='bk'>Terug</button><span>${img('trophy')} ${S.tr}</span><span>${arena()[1]}</span></div><p class='how'>${note||(nx_?'Nog '+(nx_[0]-S.tr)+' trofeeën tot de volgende beloning. Win gevechten om te stijgen!':'Alle beloningen gehaald. Je bent een legende!')}</p><div class='rd'>${TR.map(r=>{const ok=S.tr>=r[0],cl=S.tc.includes(r[0]),h=Object.keys(C).filter(k=>C[k].tr==r[0]);return `<div class='cc rw ${cl?'':ok?'in':'lock'}'>${img('trophy','ri')}<b>${r[0]}</b><span>${img('coin')} ${r[1]} munten${h.length?' + '+h.map(k=>C[k].n).join(', ')+' te koop':''}${AR.filter(m=>m[0]==r[0]).map(m=>' + map '+m[1]).join('')}</span>${cl?'<em>Gehaald</em>':ok?`<button class='btn b2 cb' data-t='${r[0]}'>Pak!</button>`:'<em>Vergrendeld</em>'}</div>`}).join('')}</div>`;
 $('bk').onclick=menu;
 document.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{const t=+b.dataset.t,r=TR.find(x=>x[0]==t);S.tc.push(t);S.co+=r[1];save();sfx(880,.3,'triangle',.07);road('+'+r[1]+' munten!')})}
function coll(note){
 state='menu';const ids=Object.keys(C).sort((a,b)=>C[a].tr-C[b].tr);
 $('ov').innerHTML=`<div class="top"><button class="btn" id="bk">Terug</button><span>Deck ${S.dk.length}/8</span><span>${img('coin')} ${S.co}</span></div><p class="how">${note||'Tik op een held om hem in je deck te zetten of te kopen. Win gevechten voor munten en trofeeën!'}</p><div class="grid">${ids.map(id=>{const c=C[id],o=S.own.includes(id),d=S.dk.includes(id);return `<div class="cc ${o?(d?'in':''):'lock'}" data-id="${id}">${img(id,'')}<b>${c.n}</b><small>${c.sp?'Spreuk':'HP '+c.hp+' · '+Math.round(c.d/c.cd)+' schade/s'}</small><small>Elixir ${c.c}</small><em>${o?(d?'In deck':'Tik om te kiezen'):S.tr<c.tr?c.tr+' trofeeën nodig':c.p+' munten'}</em></div>`}).join('')}</div>`;
 $('bk').onclick=menu;
 document.querySelectorAll('.cc').forEach(e=>e.onclick=()=>{
  const id=e.dataset.id,c=C[id];let n='';
  if(S.own.includes(id)){
   if(S.dk.includes(id)){if(S.dk.length>5)S.dk=S.dk.filter(k=>k!=id);else n='Je deck heeft minimaal 5 helden nodig.'}
   else if(S.dk.length<8)S.dk.push(id);else n='Je deck zit vol (8). Haal eerst een held eruit.'}
  else if(S.tr<c.tr)n='Nog '+(c.tr-S.tr)+' trofeeën nodig voor '+c.n+'.';
  else if(S.co<c.p)n='Nog '+(c.p-S.co)+' munten nodig voor '+c.n+'.';
  else{S.co-=c.p;S.own.push(id);if(S.dk.length<8)S.dk.push(id);n=c.n+' is van jou!';sfx(880,.3,'triangle',.07)}
  save();coll(n)})}
function finish(){
 state='end';const a=crowns[0],b=crowns[1],r=kw!=null?(kw==0?'w':'l'):a>b?'w':a<b?'l':'d',old=S.tr;
 let d=0,co=Math.round((r=='w'?50+15*a:r=='l'?15+10*a:25+10*a)*arena()[5]);
 if(r=='w'){d=10;S.st++;S.w++}else if(r=='l'){d=-Math.min(5,S.tr);S.st=0;S.l++}
 S.tr+=d;S.co+=co;const nm=AR.findIndex(m=>m[0]>old&&m[0]<=S.tr);if(nm>0)S.mp=nm;save();
 const nw=Object.keys(C).filter(k=>!S.own.includes(k)&&C[k].tr>old&&C[k].tr<=S.tr).map(k=>C[k].n);
 if(nm>0)nw.push('map '+AR[nm][1]);const X={w:['VICTORIE!','#ffd23f'],l:['VERLOREN','#ff6b7a'],d:['GELIJKSPEL','#9fd0ff']}[r];
 sfx(r=='w'?880:200,.4,'triangle',.07);
 $('ov').style.display='flex';
 $('ov').innerHTML=`<h1 style="color:${X[1]}">${X[0]}</h1><div class="rank">${img('crown')} ${a} - ${b} ${img('crown')}</div><div class="rank">${d>=0?'+':''}${d} trofeeën (${S.tr})${S.st>1?' · reeks '+S.st:''}</div><div class="rank">${img('coin')} +${co} munten</div>${nw.length?`<div class="rank" style="color:var(--gold)">Nieuw vrijgespeeld: ${nw.join(', ')}!</div>`:''}${rr()?"<div class='rank' style='color:var(--gold)'>Trofeeënweg: beloning klaar!</div>":''}<button class='btn' id='go'>Nog een keer!</button><button class='btn b2' id='co'>Menu</button>`;
 $('go').onclick=start;$('co').onclick=menu}
function fit(){const w=$('wrap'),s=Math.min(w.clientWidth/W,w.clientHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;cl+=dt;
 if(M.t>0)M.t-=dt;if(state=='play'){update(dt);hud()}draw()}
$('hud').innerHTML=`<span class="hc">${img('crown')}<b id="c0">0</b></span><span id="tm">2:00</span><span class="hc"><b id="c1">0</b>${img('crown')}</span>`;
$('elixn').innerHTML=`${img('drop')}<b id="ev">5</b>`;
Q=[...S.dk];mk();hand();fit();menu();requestAnimationFrame(loop);
</script></body></html>
